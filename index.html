<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marcelo Cardoso | Consultor de Vendas</title>
  <meta name="description" content="Página de contato de Marcelo Cardoso, consultor de vendas." />
  <style>
    :root{
      --bg:#050505;
      --bg2:#0d0d0f;
      --gold:#d8a857;
      --gold-2:#f2d18b;
      --line:rgba(216,168,87,.55);
      --soft:rgba(255,255,255,.82);
      --muted:rgba(255,255,255,.62);
      --card:rgba(17,17,19,.92);
      --shadow:0 18px 40px rgba(0,0,0,.45);
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(216,168,87,.13), transparent 20%),
        radial-gradient(circle at bottom right, rgba(216,168,87,.11), transparent 18%),
        linear-gradient(180deg, #050505 0%, #090909 100%);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      overflow-x:hidden;
    }
    body::before,
    body::after{
      content:"";
      position:fixed;
      width:280px;
      height:280px;
      border:2px solid rgba(216,168,87,.4);
      border-color:rgba(216,168,87,.4) transparent transparent rgba(216,168,87,.4);
      border-radius:50%;
      pointer-events:none;
      filter:drop-shadow(0 0 12px rgba(216,168,87,.12));
    }
    body::before{top:-120px;left:-80px;transform:rotate(8deg)}
    body::after{bottom:-130px;right:-90px;transform:rotate(210deg)}

    .wrap{
      width:min(100%, 520px);
    }

    .panel{
      position:relative;
      background:linear-gradient(180deg, rgba(8,8,9,.96), rgba(6,6,7,.94));
      border:1px solid rgba(216,168,87,.18);
      border-radius:34px;
      padding:34px 26px 28px;
      box-shadow: var(--shadow);
      overflow:hidden;
      isolation:isolate;
    }
    .panel::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(140deg, rgba(216,168,87,.12), transparent 18%),
        linear-gradient(325deg, rgba(216,168,87,.08), transparent 20%);
      z-index:-1;
    }
    .top-glow{
      position:absolute;
      inset:0 auto auto 50%;
      transform:translateX(-50%);
      width:82%;height:1px;
      background:linear-gradient(90deg, transparent, rgba(216,168,87,.4), transparent);
      box-shadow:0 0 25px rgba(216,168,87,.15);
    }

    .logo{
      display:flex;
      justify-content:center;
      margin-top:8px;
      margin-bottom:18px;
    }
    .logo img{width:180px;height:auto;max-width:55%;display:block;object-fit:contain;}

    h1{
      margin:0;
      text-align:center;
      font-size:clamp(40px, 7vw, 62px);
      line-height:.96;
      letter-spacing:-.03em;
      font-weight:900;
    }
    .name-white{color:#f3f3f3}
    .name-gold{
      background:linear-gradient(180deg, #f5dc9d 0%, #d9a857 50%, #c78b34 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }
    .role{
      text-align:center;
      margin-top:12px;
      font-size:clamp(16px, 3vw, 22px);
      letter-spacing:.32em;
      color:#ededed;
      text-transform:uppercase;
      white-space:nowrap;
    }
    .divider{
      width:76px;
      height:4px;
      margin:22px auto 26px;
      border-radius:999px;
      background:linear-gradient(90deg, var(--gold), var(--gold-2));
      box-shadow:0 0 16px rgba(216,168,87,.18);
    }
    .tagline{
      text-align:center;
      font-size:clamp(20px, 4.7vw, 28px);
      line-height:1.28;
      margin:0 0 28px;
      color:#f1f1f1;
      font-weight:300;
    }
    .tagline strong{
      display:block;
      font-weight:800;
      color:var(--gold-2);
      margin-top:4px;
    }

    .links{display:grid; gap:14px; margin-bottom:28px;}
    .cta{
      display:grid;
      grid-template-columns:74px 1fr 34px;
      align-items:center;
      gap:16px;
      min-height:88px;
      padding:0 18px 0 0;
      background:linear-gradient(180deg, rgba(17,17,19,.95), rgba(10,10,12,.95));
      border:1.5px solid rgba(216,168,87,.28);
      border-radius:999px;
      text-decoration:none;
      color:#fff;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
      transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .cta:hover{
      transform:translateY(-2px);
      border-color:rgba(216,168,87,.55);
      box-shadow:0 12px 28px rgba(0,0,0,.25), 0 0 20px rgba(216,168,87,.08);
    }
    .cta.primary{ box-shadow:0 0 0 1px rgba(216,168,87,.12), 0 0 24px rgba(216,168,87,.09); }
    .icon-col{
      height:100%;
      display:grid;
      place-items:center;
      border-right:1px solid rgba(216,168,87,.5);
      margin-left:6px;
    }
    .icon-ring{
      width:52px;height:52px;border-radius:50%;
      border:2px solid rgba(216,168,87,.95);
      display:grid;place-items:center;
    }
    .icon-plain{
      width:32px;height:32px;
      display:grid;place-items:center;
    }
    .cta svg{width:27px;height:27px;stroke:var(--gold-2);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
    .copy{min-width:0}
    .eyebrow{
      display:block;
      font-size:clamp(14px, 2.4vw, 18px);
      color:var(--soft);
      margin-bottom:2px;
      letter-spacing:.01em;
    }
    .mainline{
      display:block;
      font-size:clamp(24px, 4vw, 34px);
      font-weight:800;
      line-height:1.05;
      color:#fff;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .mainline.small{font-size:clamp(20px, 3.5vw, 28px)}
    .arrow{
      font-size:44px;
      line-height:1;
      color:var(--gold-2);
      font-weight:300;
      text-align:center;
      opacity:.95;
    }

    .bottom-note{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      color:#f1f1f1;
      text-align:center;
      font-size:clamp(14px, 2.8vw, 18px);
      letter-spacing:.12em;
      text-transform:uppercase;
      margin-top:4px;
    }
    .bottom-note .camera{display:grid;place-items:center}
    .bottom-note svg{width:28px;height:28px;stroke:var(--gold-2);fill:none;stroke-width:2}
    .bottom-note .gold{color:var(--gold-2);display:block;margin-top:4px;letter-spacing:.13em}
    .underline{
      width:64px;height:4px;border-radius:999px;
      background:linear-gradient(90deg, var(--gold), var(--gold-2));
      margin:12px auto 2px;
    }

    @media (max-width: 560px){
      .panel{padding:28px 18px 24px;border-radius:28px}
      .cta{grid-template-columns:68px 1fr 30px; min-height:82px; padding-right:14px}
      h1{font-size:clamp(32px, 9vw, 44px);line-height:1.05}
      .role{font-size:clamp(11px, 3vw, 15px);letter-spacing:.16em;white-space:normal}
      .cta{grid-template-columns:54px minmax(0, 1fr) 18px;gap:8px;min-height:76px;padding-right:12px}
      .icon-col{margin-left:2px}
      .icon-ring{width:40px;height:40px}
      .icon-plain{width:28px;height:28px}
      .cta svg{width:23px;height:23px}
      .eyebrow{font-size:13px}
      .mainline{font-size:clamp(16px, 4.6vw, 22px);white-space:normal;overflow-wrap:anywhere;line-height:1.18}
      .mainline.small{font-size:clamp(13px, 3.65vw, 18px)}
      .arrow{font-size:30px}
      .tagline{font-size:clamp(18px, 4.7vw, 24px)}
      .bottom-note{font-size:clamp(14px, 3.6vw, 17px);letter-spacing:.035em}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <div class="top-glow"></div>

      <div class="logo"><img src="logo_marcelo_cardoso.png" alt="Logo MC dourada de Marcelo Cardoso" width="180" height="132"></div>

      <h1><span class="name-white">Marcelo</span> <span class="name-gold">Cardoso</span></h1>
      <div class="role">Consultor de Vendas</div>
      <div class="divider"></div>

      <p class="tagline">
        O veículo que você procura,
        <strong>eu encontro para você.</strong>
      </p>

      <div class="links">
        <a class="cta primary" href="https://wa.me/5551991163303" target="_blank" rel="noopener noreferrer">
          <div class="icon-col">
            <div class="icon-ring" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.57 7.5L3 20l1.08-5.15A8.5 8.5 0 1 1 21 11.5Z"></path><path d="M9 8.9c.2-.4.4-.4.7-.4h.6c.2 0 .4 0 .5.4l.9 2.1c.1.2.1.4 0 .6l-.7 1c-.1.2-.1.4 0 .6.5.8 1.2 1.6 2.1 2.1.2.1.4.1.6 0l1-.7c.2-.1.4-.1.6 0l2.1.9c.4.1.4.3.4.5v.6c0 .3 0 .5-.4.7-.5.2-1.1.4-1.8.4a8.2 8.2 0 0 1-7-4 8.3 8.3 0 0 1-1.1-4c0-.7.1-1.3.5-1.8Z"></path></svg>
            </div>
          </div>
          <div class="copy">
            <span class="eyebrow">Falar no WhatsApp</span>
            <span class="mainline">(51) 99116-3303</span>
          </div>
          <div class="arrow">›</div>
        </a>

        <a class="cta" href="https://www.instagram.com/marcelocardosors/" target="_blank" rel="noopener noreferrer">
          <div class="icon-col">
            <div class="icon-plain" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4.2"></circle><path d="M17.5 6.5h.01"></path></svg>
            </div>
          </div>
          <div class="copy">
            <span class="eyebrow">Acompanhe no Instagram</span>
            <span class="mainline small">@marcelocardosors</span>
          </div>
          <div class="arrow">›</div>
        </a>

        <a class="cta" href="mailto:marcelocardosrs@gmail.com">
          <div class="icon-col">
            <div class="icon-plain" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"></path><path d="m4 7 8 6 8-6"></path></svg>
            </div>
          </div>
          <div class="copy">
            <span class="eyebrow">Enviar um e-mail</span>
            <span class="mainline small">marcelocardosrs@gmail.com</span>
          </div>
          <div class="arrow">›</div>
        </a>
      </div>

      <div class="bottom-note">
        <div>
          <span class="gold">Seu próximo veículo começa com uma conversa.</span>
        </div>
      </div>
      <div class="underline"></div>
    </section>
  </main>
</body>
</html>
